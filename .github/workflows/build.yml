name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: unzip FFProxyTool-source.zip -d src

      - name: Build
        run: cd src/FFProxyTool && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FFProxyTool-APK
          path: src/FFProxyTool/app/build/outputs/apk/debug/app-debug.apk
